<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Queen’s Park Watch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,400&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: a legislative record — sticky masthead, one reading column for prose,
   wide panels for charts and tables; party colour is the only loud colour. */
:root{
  --ground:#EEF1EE;--sheet:#FBFCFB;--ink:#14201B;--muted:#5A6862;--rule:#C8D3CD;--soft:#E1E8E4;--accent:#1D5A44;
  --pc:#1D4E9E;--ndp:#D9701A;--lib:#C2202F;--grn:#3A8A35;--ind:#7A7F86;
  --good:#1C7A52;--bad:#B5401F;--warn:#A57A12;--prog:#1D4E9E;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --sans:"Schibsted Grotesk","Helvetica Neue",Arial,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#0F1512;--sheet:#161E1A;--ink:#E5ECE8;--muted:#98A69F;--rule:#2E3A35;--soft:#1E2823;--accent:#7FC3A4;--pc:#7EA8F0;--ndp:#F2A25E;--lib:#F07A84;--grn:#7FCB78;--ind:#A0A6AD;--good:#5FCB98;--bad:#F08A6A;--warn:#E3B651;--prog:#7EA8F0;color-scheme:dark}}
:root[data-theme="dark"]{--ground:#0F1512;--sheet:#161E1A;--ink:#E5ECE8;--muted:#98A69F;--rule:#2E3A35;--soft:#1E2823;--accent:#7FC3A4;--pc:#7EA8F0;--ndp:#F2A25E;--lib:#F07A84;--grn:#7FCB78;--ind:#A0A6AD;--good:#5FCB98;--bad:#F08A6A;--warn:#E3B651;--prog:#7EA8F0;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.05;letter-spacing:-.01em}
h2{font-size:1.55rem;line-height:1.2}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
.wrap{max-width:74rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--sheet);border-bottom:1px solid var(--rule)}
.mast .wrap{display:flex;align-items:center;gap:.5rem 1.5rem;flex-wrap:wrap;padding-block:.6rem}
.brand{font-family:var(--serif);font-weight:700;font-size:1.25rem;text-decoration:none;white-space:nowrap}
.brand span{color:var(--accent)}
.nav{display:flex;gap:.2rem;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{text-decoration:none;padding:.35rem .7rem;border-radius:999px;font-size:.93rem;font-weight:500;white-space:nowrap;color:var(--muted)}
.nav a:hover{color:var(--ink);background:var(--soft)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--sheet)}

main{padding-block:1.6rem 5rem}
.stack{display:flex;flex-direction:column;gap:2.4rem}
.lede{display:flex;flex-direction:column;gap:.7rem;max-width:46rem}
.dek{font-family:var(--serif);font-size:1.15rem;line-height:1.5;color:var(--muted)}
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.back{font-size:.9rem;color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:1.2rem;min-width:0}
.sec{display:flex;flex-direction:column;gap:.9rem}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.3rem 1rem}
.sub{color:var(--muted);font-size:.95rem;max-width:44rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr));gap:1rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr));gap:1rem}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,10.5rem),1fr));gap:.8rem}
.stat{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.15rem}
.stat b{font-family:var(--serif);font-size:2rem;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--muted)}

/* chips and pills */
.chip{display:inline-flex;align-items:center;gap:.35rem;font-size:.78rem;font-weight:600;padding:.12rem .55rem;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap;line-height:1.4}
.chip.k{color:var(--muted);border-color:var(--rule)}
.chip.good{color:var(--good)}.chip.bad{color:var(--bad)}.chip.warn{color:var(--warn)}.chip.prog{color:var(--prog)}
.pdot{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;background:var(--c);flex:none}
.party{display:inline-flex;align-items:center;gap:.35rem;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1.5px solid var(--ink);border-radius:999px;padding:.4rem .9rem;font-weight:600;font-size:.9rem;text-decoration:none;background:none;cursor:pointer}
.btn.solid{background:var(--ink);color:var(--sheet)}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;color:var(--accent);font-weight:600;font-size:.9rem;text-decoration:underline;text-underline-offset:3px}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.filters input[type=search],.filters select{background:var(--sheet);border:1px solid var(--rule);border-radius:999px;padding:.5rem .9rem;font-size:.95rem;min-width:0;max-width:100%}
.filters input[type=search]{flex:1 1 15rem}
.seg{display:inline-flex;flex-wrap:wrap;gap:.3rem}
.seg button{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.35rem .75rem;font-size:.86rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.toggle{display:inline-flex;align-items:center;gap:.4rem;font-size:.88rem;color:var(--muted);cursor:pointer;padding:.3rem .2rem}
.count{font-size:.9rem;color:var(--muted)}

/* vote list */
.vlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.vlist li{border-top:1px solid var(--rule)}
.vlist li:first-child{border-top:0}
.vrow{display:grid;grid-template-columns:6.2rem minmax(0,1fr) 9rem;gap:.2rem 1rem;padding:.8rem .2rem;text-decoration:none;align-items:center}
.vrow:hover{background:var(--soft)}
.vrow .dt{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.vrow .tt{min-width:0}
.vrow .tt b{display:block;font-weight:600;overflow-wrap:anywhere}
.vrow .tt small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:.86rem}
.vrow .tags{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.3rem}
.vrow .res{display:flex;flex-direction:column;gap:.3rem;align-items:stretch}
.vrow .res .sc{display:flex;justify-content:space-between;font-size:.85rem;font-weight:600;font-variant-numeric:tabular-nums}
@media (max-width:40rem){.vrow{grid-template-columns:minmax(0,1fr) 6.5rem}.vrow .dt{grid-column:1/-1}}
.split{display:flex;height:.5rem;border-radius:999px;overflow:hidden;background:var(--soft)}
.split i{display:block;height:100%}
.split .y{background:var(--good)}.split .n{background:var(--bad)}
.more{display:flex;justify-content:center;padding-top:1rem}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--rule);border-radius:12px;background:var(--sheet)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:.55rem .8rem;border-bottom:1px solid var(--rule);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
th{font-size:.8rem;font-weight:600;color:var(--muted);white-space:nowrap}
th button{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
th button[data-dir]::after{content:attr(data-dir);margin-left:.25rem}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.vy{color:var(--good);font-weight:700}.vn{color:var(--bad);font-weight:700}
.minibar{display:inline-block;width:5rem;height:.4rem;border-radius:999px;background:var(--soft);vertical-align:middle;margin-left:.4rem;overflow:hidden}
.minibar i{display:block;height:100%;background:var(--accent)}

/* seat wall */
.wall{display:flex;flex-direction:column;gap:.55rem}
.wall .grp{display:grid;grid-template-columns:6.5rem minmax(0,1fr);gap:.6rem;align-items:start}
.wall .gl{font-size:.82rem;font-weight:600;color:var(--c)}
.wall .gl small{display:block;color:var(--muted);font-weight:500}
.wall .sq{display:flex;flex-wrap:wrap;gap:3px}
.wall a{display:block;line-height:0}
.wall i{display:block;width:14px;height:14px;border-radius:3px;border:2px solid var(--c);background:var(--c)}
.wall i.n{background:transparent}
.wall i.x{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:.3rem 1.1rem;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;border:2px solid var(--muted);margin-right:.35rem;vertical-align:-1px}

/* charts */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--sans);font-size:11px}
.chart .grid{stroke:var(--rule);stroke-width:1}
.hbar{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr) 3.4rem;gap:.4rem .7rem;align-items:center;font-size:.9rem}
.hbar .t{height:.7rem;border-radius:999px;background:var(--soft);overflow:hidden;position:relative}
.hbar .t i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--c,var(--accent))}
.hbar .l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.big{font-family:var(--serif);font-size:2.6rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.res-c{color:var(--good)}.res-l{color:var(--bad)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:.35rem 1rem;font-size:.93rem}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0}
.timeline{list-style:none;margin:0;padding:0 0 0 1rem;border-left:2px solid var(--rule);display:flex;flex-direction:column;gap:.7rem}
.timeline li{position:relative;font-size:.93rem}
.timeline li::before{content:"";position:absolute;left:-1.42rem;top:.45rem;width:.65rem;height:.65rem;border-radius:50%;background:var(--sheet);border:2px solid var(--c,var(--accent))}
.timeline .d{font-weight:600;margin-right:.4rem}
.note{border-left:3px solid var(--accent);padding:.15rem 0 .15rem .9rem;max-width:46rem}
.callout{display:flex;flex-direction:column;gap:.6rem}
.callout .big{font-size:2.2rem}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rank li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.6rem;padding:.5rem 0;border-top:1px solid var(--rule);align-items:center}
.rank li:first-child{border-top:0}
.rank a{text-decoration:none;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank a:hover{text-decoration:underline}
.rank small{display:block;color:var(--muted);font-weight:400;font-size:.82rem}

/* commitments (Downey) */
.prom{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:1.1rem;display:flex;flex-direction:column;gap:.55rem;border-top:4px solid var(--sc)}
.prom .said{font-family:var(--serif);font-size:1.12rem;line-height:1.45}
.prom h4{font-size:.8rem;margin:.3rem 0 0;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.ev{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.45rem;font-size:.93rem}
.ev .d{font-weight:600;font-variant-numeric:tabular-nums;margin-right:.35rem}
.side{background:var(--soft);border-radius:8px;padding:.6rem .8rem;font-size:.92rem}
.track{height:.5rem;border-radius:999px;background:var(--soft);overflow:hidden}
.track span{display:block;height:100%;background:var(--sc)}
.trackl{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}
.metric .bars{display:flex;align-items:flex-end;gap:.5rem;height:7rem}
.metric .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:.25rem;height:100%}
.metric .bar i{display:block;width:100%;max-width:3.2rem;border-radius:4px 4px 0 0;background:var(--accent)}
.metric .bar.pre i{background:var(--muted)}
.metric .bar b{font-size:.8rem;font-variant-numeric:tabular-nums}
.metric .xl{display:flex;gap:.5rem}
.metric .xl span{flex:1;text-align:center;font-size:.74rem;color:var(--muted)}
.srcs{font-size:.82rem;color:var(--muted)}
.foot{margin-top:3rem;padding-top:1rem;border-top:1px solid var(--rule);font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:.4rem}
.loading{padding:4rem 0;color:var(--muted)}
.funnel{display:flex;flex-direction:column;gap:.8rem}
.funnel .row{display:grid;grid-template-columns:minmax(0,10rem) minmax(0,1fr);gap:.3rem 1rem;align-items:center}
.funnel .lab{font-size:.9rem;font-weight:600;min-width:0}
.funnel .lab small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.stackbar{display:flex;height:1.6rem;border-radius:6px;overflow:hidden;background:var(--soft)}
.stackbar i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.72rem;font-weight:700;color:var(--sheet);min-width:0;overflow:hidden;white-space:nowrap}
@media (max-width:40rem){.funnel .row{grid-template-columns:1fr}}
.o-law{background:var(--good)}.o-passed{background:color-mix(in srgb,var(--good) 55%,var(--sheet))}.o-committee{background:var(--warn)}.o-defeated{background:var(--bad)}.o-debated{background:color-mix(in srgb,var(--muted) 70%,var(--sheet))}.o-intro{background:var(--rule)}
.o-intro{color:var(--muted)!important}
.legend .sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:.35rem;vertical-align:-1px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:1.1rem;display:flex;flex-direction:column;gap:.6rem;min-width:0}
.card .top{display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap;align-items:baseline}
.card h3{font-size:1.15rem}
.hist{display:flex;align-items:flex-end;gap:4px;height:8rem}
.hist div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:.2rem;height:100%;min-width:0}
.hist i{display:block;width:100%;border-radius:3px 3px 0 0;background:var(--accent)}
.hist b{font-size:.72rem;font-variant-numeric:tabular-nums}
.hist span{font-size:.7rem;color:var(--muted);text-align:center;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.split i,.hbar .t i{transition:width .3s ease}}
</style>

<header class="mast"><div class="wrap"><a class="brand" href="#">Queen’s Park <span>Watch</span></a><nav class="nav" id="nav" aria-label="Sections"></nav></div></header>
<main class="wrap" id="app"><p class="loading">Loading 705 recorded votes…</p></main>

<script>
(function(){
'use strict';
var D=null, app=document.getElementById('app'), nav=document.getElementById('nav');
var PARTY={PC:['Progressive Conservative','--pc'],NDP:['New Democratic','--ndp'],Liberal:['Liberal','--lib'],Green:['Green','--grn'],Ind:['Independent','--ind']};
var KIND={bill:'Bill readings',closure:'Closure',ta:'Time allocation',opp:'Opposition day',pmm:"Private members' motions",conf:'Budget and throne speech',motion:'Other motions'};
var PARL={42:'42nd (2018–22)',43:'43rd (2022–25)',44:'44th (2025–)'};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
function pc(p){return 'var('+(PARTY[p]||PARTY.Ind)[1]+')';}
function pn(p){return (PARTY[p]||[p])[0];}
function fmt(s,short){if(!s)return '';var a=s.split('-').map(Number);var d=new Date(a[0],a[1]-1,a[2]||1);return d.toLocaleDateString('en-CA',short?{month:'short',year:'numeric'}:{month:'short',day:'numeric',year:'numeric'});}
function pct(a,b){return b?Math.round(a/b*100):0;}
function partyChip(p){return '<span class="party"><span class="pdot" style="--c:'+pc(p)+'"></span>'+esc(p)+'</span>';}
function slug(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
var store={get:function(k){try{return JSON.parse(localStorage.getItem('qpw:'+k));}catch(e){return null;}},set:function(k,v){try{localStorage.setItem('qpw:'+k,JSON.stringify(v));}catch(e){}}};

/* ---------------- data model ---------------- */
var V=[],byId={},people=[],byName={},bySlug={},bills={},billVotes={};
function prepare(){
  var seats=D.seats.map(function(s){return {person:s[0],party:D.parties[s[1]],riding:D.ridings[s[2]],hon:s[3]};});
  people=D.people.map(function(n,i){var pr=D.profiles[n]||{};return {i:i,name:n,slug:pr.slug||slug(n),prof:pr,votes:[],rebel:[],party:null,riding:null,hon:0,first:null,last:null};});
  people.forEach(function(p){byName[p.name]=p;bySlug[p.slug]=p;});
  D.bills.forEach(function(b){bills[b.k]=b;billVotes[b.k]=[];});
  V=D.votes.map(function(v){
    var roll=[];v.y.forEach(function(s){roll.push([seats[s],'y']);});v.n.forEach(function(s){roll.push([seats[s],'n']);});
    var by={};roll.forEach(function(r){var p=r[0].party;by[p]=by[p]||{y:0,n:0};by[p][r[1]]++;});
    var line={};Object.keys(by).forEach(function(p){line[p]=by[p].y>by[p].n?'y':by[p].n>by[p].y?'n':null;});
    var rebels=roll.filter(function(r){var p=r[0].party;return p!=='Ind'&&line[p]&&by[p].y+by[p].n>1&&r[1]!==line[p];});
    var o={id:v.id,bill:v.b,title:v.t,stage:v.st,date:v.d,parl:v.p,sess:v.s,src:v.src,kind:v.k,bk:v.bk,flags:v.f,roll:roll,by:by,line:line,rebels:rebels,
      yes:v.y.length,no:v.n.length,carried:v.y.length>v.n.length,margin:Math.abs(v.y.length-v.n.length),year:+v.d.slice(0,4)};
    o.text=(o.bill+' '+o.title+' '+o.stage).toLowerCase();
    // did the government (PC) side win? PC majority line vs result
    o.govLine=line.PC||null;
    return o;
  });
  V.forEach(function(v,vi){
    byId[v.id]=v;v.bk.forEach(function(k){if(billVotes[k])billVotes[k].push(v);});
    v.roll.forEach(function(r){var p=people[r[0].person];var reb=r[0].party!=='Ind'&&v.line[r[0].party]&&v.by[r[0].party].y+v.by[r[0].party].n>1&&r[1]!==v.line[r[0].party];
      p.votes.push({v:v,vote:r[1],party:r[0].party,riding:r[0].riding,hon:r[0].hon,rebel:reb});if(reb)p.rebel.push(v);
      p.party=r[0].party;p.riding=r[0].riding;p.hon=r[0].hon;if(!p.first)p.first=v.date;p.last=v.date;p.parls=p.parls||{};p.parls[v.parl]=1;});
  });
  // participation: present / votes held between first and last appearance
  var dates=V.map(function(v){return v.date;});
  people.forEach(function(p){if(!p.votes.length){p.held=0;return;}var lo=lower(dates,p.first),hi=upper(dates,p.last);p.held=hi-lo;p.part=pct(p.votes.length,p.held);
    var cnt={};p.votes.forEach(function(x){cnt[x.party]=(cnt[x.party]||0)+1;});p.loyal=pct(p.votes.length-p.rebel.length,p.votes.length);});
}
function lower(a,x){var l=0,h=a.length;while(l<h){var m=(l+h)>>1;if(a[m]<x)l=m+1;else h=m;}return l;}

function timeline(){
  // votes per quarter, stacked: closure+time allocation vs everything else
  var q={};V.forEach(function(v){var k=v.date.slice(0,4)+'-Q'+(Math.floor((+v.date.slice(5,7)-1)/3)+1);q[k]=q[k]||{cut:0,other:0};if(v.kind==='closure'||v.kind==='ta')q[k].cut++;else q[k].other++;});
  var keys=[];for(var y=2018;y<=+D.built.slice(0,4);y++)for(var i=1;i<=4;i++){var k=y+'-Q'+i;if((y===2018&&i<3))continue;if(k>D.built.slice(0,4)+'-Q'+(Math.floor((+D.built.slice(5,7)-1)/3)+1))break;keys.push(k);}
  var max=Math.max.apply(null,keys.map(function(k){return q[k]?q[k].cut+q[k].other:0;}));max=Math.ceil(max/10)*10;
  var W=760,H=200,L=30,B=24,T=8,bw=(W-L)/keys.length;
  var s='<svg viewBox="0 0 '+W+' '+(H+B)+'" role="img" aria-label="Recorded votes per quarter, 2018 to '+D.built.slice(0,4)+', with closure and time allocation highlighted">';
  for(var g=0;g<=max;g+=max/4){var yy=T+(H-T)*(1-g/max);s+='<line class="grid" x1="'+L+'" x2="'+W+'" y1="'+yy+'" y2="'+yy+'"/><text x="'+(L-6)+'" y="'+(yy+4)+'" text-anchor="end">'+g+'</text>';}
  keys.forEach(function(k,i){var c=q[k]||{cut:0,other:0},x=L+i*bw+bw*.15,w=bw*.7,h1=(H-T)*c.other/max,h2=(H-T)*c.cut/max;
    s+='<rect x="'+x+'" y="'+(H-h1)+'" width="'+w+'" height="'+h1+'" rx="1.5" fill="var(--rule)"><title>'+k+': '+(c.cut+c.other)+' votes, '+c.cut+' closure or time allocation</title></rect>';
    s+='<rect x="'+x+'" y="'+(H-h1-h2)+'" width="'+w+'" height="'+h2+'" rx="1.5" fill="var(--bad)"><title>'+k+': '+c.cut+' closure or time allocation</title></rect>';
    if(k.slice(-2)==='Q1'||i===0)s+='<text x="'+(x+w/2)+'" y="'+(H+16)+'" text-anchor="middle">'+k.slice(0,4)+'</text>';});
  // election markers
  [['2022-06-02','2022 election'],['2025-02-27','2025 election']].forEach(function(e){var k=e[0].slice(0,4)+'-Q'+(Math.floor((+e[0].slice(5,7)-1)/3)+1),i=keys.indexOf(k);if(i<0)return;var x=L+i*bw+bw/2;s+='<line x1="'+x+'" x2="'+x+'" y1="'+T+'" y2="'+H+'" stroke="var(--muted)" stroke-dasharray="3 3"/><text x="'+(x+4)+'" y="'+(T+10)+'">'+e[1]+'</text>';});
  return s+'</svg>';
}

function compare(a,b){

/* ----- opposition bills ----- */
var OUT={law:['Became law','o-law'],passed:['Passed third reading','o-passed'],committee:['Passed second reading, stopped in committee','o-committee'],defeated:['Defeated at second reading','o-defeated'],debated:['Debated, no vote','o-debated'],intro:['Never debated','o-intro']};
var TOPICS=[['Housing and renters',/rent|tenant|housing|homeless|evict|landlord/i],['Health and long-term care',/health|care|hospital|nurse|patient|medic|mental|drug|pharma|long-term|dental/i],['Workers and wages',/worker|wage|pay|labour|employ|sick|wsib|scab|injur/i],['Climate and environment',/climate|carbon|environment|green|flood|water|gas|energy|agricultural land/i],['Democracy and accountability',/integrity|corruption|election|democra|accountab|transparen|advocate|commissioner|watchdog/i],['Transport and highways',/highway|transit|transport|road|vehicle|mobility/i],['Education and child care',/school|education|child ?care|student|early years/i]];
var of=Object.assign({q:'',party:'',parl:''},store.get('of')||{});
function oppGroups(){return [['PC backbench','PC','Government MPPs outside cabinet'],['New Democratic','NDP',''],['Liberal','Liberal',''],['Green','Green',''],['Independent','Ind','']].map(function(g){var list=D.allBills.filter(function(b){return b.kind==='pmb'&&b.party===g[1];});var c={};list.forEach(function(b){c[b.o]=(c[b.o]||0)+1;});return {label:g[0],party:g[1],note:g[2],list:list,c:c};}).filter(function(g){return g.list.length;});}
function vOpposition(){
  var G=oppGroups(),opp=D.allBills.filter(function(b){return b.kind==='pmb'&&b.party!=='PC';}),pcb=D.allBills.filter(function(b){return b.kind==='pmb'&&b.party==='PC';});
  var oLaw=opp.filter(function(b){return b.o==='law';}).length,pLaw=pcb.filter(function(b){return b.o==='law';}).length;
  var defeated=opp.filter(function(b){return b.o==='defeated';}),defRec=defeated.filter(function(b){return b.v2;}),pcFor=defRec.reduce(function(s,b){return s+b.v2[3];},0);
  var unopp=opp.filter(function(b){return b.o==='committee'&&b.v2&&b.v2[2]===0;});
  var pcDefeated=pcb.filter(function(b){return b.o==='defeated';}).length;
  var h='<section class="lede"><h1>Opposition bills</h1><p class="dek">What happens to bills introduced by MPPs who aren’t in cabinet. Government backbench bills are shown alongside for comparison.</p></section>';
  h+='<section class="stats">'+stat(opp.length,'bills introduced by NDP, Liberal, Green and independent MPPs since 2018')+stat(oLaw+' ('+pct(oLaw,opp.length)+'%)','of them became law, compared with '+pLaw+' of '+pcb.length+' PC backbench bills ('+pct(pLaw,pcb.length)+'%)')+
   stat(defeated.length,'opposition bills defeated at second reading; '+pcDefeated+' PC backbench bills were')+stat(pcFor,'PC votes cast in favour, across the '+defRec.length+' defeats that were recorded votes')+'</section>';
  h+='<section class="panel sec"><h2>How far bills get, by sponsor’s party</h2><p class="sub">Each bar is every private member’s bill introduced by that party’s MPPs, 2018 to today. Party is the sponsor’s party on the day the bill was introduced.</p><div class="funnel">'+G.map(function(g){var t=g.list.length;return '<div class="row"><span class="lab">'+esc(g.label)+'<small>'+t+' bills'+(g.note?' · '+esc(g.note):'')+'</small></span><div class="stackbar" role="img" aria-label="'+esc(g.label+': '+Object.keys(OUT).filter(function(k){return g.c[k];}).map(function(k){return g.c[k]+' '+OUT[k][0].toLowerCase();}).join(', '))+'">'+Object.keys(OUT).filter(function(k){return g.c[k];}).map(function(k){var w=g.c[k]/t*100;return '<i class="'+OUT[k][1]+'" style="width:'+w.toFixed(2)+'%" title="'+esc(OUT[k][0]+': '+g.c[k]+' ('+Math.round(w)+'%)')+'">'+(w>=7?g.c[k]:'')+'</i>';}).join('')+'</div></div>';}).join('')+'</div>'+
   '<div class="legend">'+Object.keys(OUT).map(function(k){return '<span><span class="sw '+OUT[k][1]+'"></span>'+OUT[k][0]+'</span>';}).join('')+'</div>'+
   '<p class="sub">Bills from the current session that are still in committee or not yet debated can still move. Most private members’ bills from every party are never called for debate, because each MPP gets a limited number of debate slots.</p></section>';
  // topics
  var topicRows=TOPICS.map(function(t){var n=defeated.filter(function(b){return t[1].test(b.t+' '+b.lt);}).length;return [t[0],n,'var(--bad)'];}).filter(function(r){return r[1];}).sort(function(a,b){return b[1]-a[1];});
  h+='<section class="grid2"><div class="panel sec"><h2>What the defeated bills were about</h2><p class="sub">Defeated opposition bills, grouped by keywords in their titles. A bill can fall in more than one group.</p>'+hbars(topicRows)+'</div>';
  h+='<div class="panel sec"><h2>Passed second reading with no one opposed, then stopped</h2><p class="sub">Opposition bills that every MPP present supported at second reading, sent to a committee that never reported them back.</p><ul class="rank">'+unopp.map(function(b){return '<li><a href="#v-'+b.v2[0]+'">'+esc(b.n+', '+b.t)+'<small>'+esc(b.sp[0])+' ('+esc(b.party)+') · passed '+b.v2[1]+'–0 on '+esc(fmt(byId[b.v2[0]].date))+(b.open?' · current session, still in committee':'')+'</small></a><span class="chip warn">In committee</span></li>';}).join('')+'</ul></div></section>';
  // defeated table
  var q=of.q.toLowerCase();
  var list=defeated.filter(function(b){return (!of.party||b.party===of.party)&&(!of.parl||String(b.p)===of.parl)&&(!q||(b.n+' '+b.t+' '+b.lt+' '+b.sp.join(' ')).toLowerCase().indexOf(q)>-1);}).sort(function(a,b){return (b.v2?byId[b.v2[0]].date:b.fr).localeCompare(a.v2?byId[a.v2[0]].date:a.fr);});
  h+='<section class="sec"><div class="sec-head"><h2>Every opposition bill defeated at second reading</h2></div><p class="sub">Second reading is the vote on whether the House agrees with a bill’s principle. A defeat there ends the bill.</p>'+
   '<div class="filters" role="search"><label class="sr" for="oq">Search defeated bills</label><input id="oq" type="search" placeholder="Search: rent, sick days, highway…" value="'+esc(of.q)+'">'+sel('oparty','Party',[['','All parties'],['NDP','New Democratic'],['Liberal','Liberal'],['Green','Green'],['Ind','Independent']],of.party)+sel('oparl','Parliament',[['','All parliaments']].concat([42,43,44].map(function(p){return [String(p),PARL[p]];})),of.parl)+'</div>'+
   '<p class="count"><b>'+list.length+'</b> bills</p><div class="tw"><table><thead><tr><th>Date</th><th>Bill</th><th>Sponsor</th><th class="r">Vote</th><th class="r">PC for</th></tr></thead><tbody>'+list.map(function(b){var v=b.v2&&byId[b.v2[0]];return '<tr><td class="num">'+(v?esc(fmt(v.date)):'<span class="muted">voice vote</span>')+'</td><td>'+(v?'<a href="#v-'+v.id+'"><b>'+esc(b.n)+'</b></a>':'<b>'+esc(b.n)+'</b>')+' <span class="muted">'+b.p+'-'+b.s+'</span><br><span style="font-size:.88rem">'+esc(b.t)+'</span></td><td>'+esc(b.sp[0])+(b.sp.length>1?' <span class="muted">+'+(b.sp.length-1)+'</span>':'')+'<br>'+partyChip(b.party)+'</td><td class="r">'+(v?v.yes+'–'+v.no:'')+'</td><td class="r">'+(b.v2?b.v2[3]:'')+'</td></tr>';}).join('')+'</tbody></table></div></section>';
  page('opposition',h);
}

/* ----- government record ----- */
var RKIND={court:'Court rulings',reversal:'Reversals and repeals',pairing:'Opposition proposed, government acted later',other:'Other'};
function vRecord(){
  var gov=D.allBills.filter(function(b){return b.kind==='gov'&&b.n!=='Bill 1';});
  var law=gov.filter(function(b){return b.ra;}),days=law.map(function(b){return Math.round((new Date(b.ra)-new Date(b.fr))/864e5);});
  var med=days.slice().sort(function(a,b){return a-b;})[Math.floor(days.length/2)];
  var cutBills=D.bills.map(function(b){var vs=(billVotes[b.k]||[]).filter(function(v){return v.kind==='closure'||v.kind==='ta';});return [b,vs.length];}).filter(function(x){return x[1];}).sort(function(a,b){return b[1]-a[1];});
  var opp=V.filter(function(v){return v.kind==='opp';});
  var h='<section class="lede"><h1>Government record</h1><p class="dek">Where the government’s own laws were reversed, repealed or struck down, how quickly bills were passed, and how often debate was limited. Every item links to its source.</p></section>';
  h+='<section class="stats">'+stat(law.length+' of '+gov.length,'government bills became law')+stat(med+' days','median time from first reading to royal assent')+stat(V.filter(function(v){return v.kind==='closure'||v.kind==='ta';}).length,'recorded votes on closure or time allocation')+stat(opp.filter(function(v){return v.carried;}).length+' of '+opp.length,'opposition day motions passed')+'</section>';
  var R=D.record||[];
  if(R.length){Object.keys(RKIND).forEach(function(k){var items=R.filter(function(r){return r.kind===k;}).sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});if(!items.length)return;
    h+='<section class="sec"><h2>'+RKIND[k]+'</h2><div class="grid2">'+items.map(recordCard).join('')+'</div></section>';});}
  else h+='<section class="panel"><p class="muted">Sourced items on court rulings and reversals are being added.</p></section>';
  // fast-tracked
  var bins=[[0,0,'Same day'],[1,7,'1–7'],[8,30,'8–30'],[31,60,'31–60'],[61,120,'61–120'],[121,99999,'121+']];
  var counts=bins.map(function(b){return days.filter(function(d){return d>=b[0]&&d<=b[1];}).length;}),cmax=Math.max.apply(null,counts);
  var fast=law.map(function(b,i){return [b,days[i]];}).filter(function(x){return x[1]<=7;}).sort(function(a,b){return a[1]-b[1]||a[0].fr.localeCompare(b[0].fr);});
  h+='<section class="grid2"><div class="panel sec"><h2>How fast government bills became law</h2><p class="sub">Days from first reading to royal assent, for the '+law.length+' government bills that became law.</p><div class="hist" role="img" aria-label="'+esc(bins.map(function(b,i){return b[2]+' days: '+counts[i];}).join(', '))+'">'+bins.map(function(b,i){return '<div><b>'+counts[i]+'</b><i style="height:'+Math.max(2,counts[i]/cmax*100).toFixed(1)+'%"></i><span>'+b[2]+'</span></div>';}).join('')+'</div><p class="sub" style="text-align:center">days</p></div>'+
   '<div class="panel sec"><h2>Passed within a week</h2><p class="sub">Many are COVID-19 emergency measures and spending bills, which often pass quickly with all-party agreement.</p><ul class="rank">'+fast.map(function(x){var b=x[0];return '<li>'+(bills[b.k]?'<a href="#b-'+b.k+'">':'<a href="'+esc(b.url)+'" target="_blank" rel="noopener">')+esc(b.n+', '+b.t)+'<small>'+esc(fmt(b.fr))+' to '+esc(fmt(b.ra))+'</small></a><span class="num"><b>'+x[1]+'</b> <span class="muted">'+(x[1]===1?'day':'days')+'</span></span></li>';}).join('')+'</ul></div></section>';
  // debate limits per bill
  h+='<section class="sec"><h2>Bills with the most debate limits</h2><p class="sub">Recorded votes on closure or time allocation tied to each bill. One time-allocation motion often covers several bills.</p><div class="tw"><table><thead><tr><th>Bill</th><th>Sponsor</th><th class="r">Closure / time allocation votes</th><th>Status</th></tr></thead><tbody>'+cutBills.slice(0,15).map(function(x){var b=x[0];return '<tr><td><a href="#b-'+b.k+'"><b>'+esc(b.n)+'</b></a> <span class="muted">'+b.p+'-'+b.s+'</span><br><span style="font-size:.88rem">'+esc(b.t)+'</span></td><td>'+esc(b.sp.map(function(s){return s[0];}).join(', '))+'</td><td class="r">'+x[1]+'</td><td>'+(b.ra?'<span class="chip good">Law</span>':'<span class="chip k">Not law</span>')+'</td></tr>';}).join('')+'</tbody></table></div></section>';
  // gov bills that did not pass
  var notLaw=gov.filter(function(b){return !b.ra;}).sort(function(a,b){return b.fr.localeCompare(a.fr);});
  h+='<section class="sec"><h2>Government bills that did not become law</h2><p class="sub">Bills still open in the current session can still pass. Others ended when the session closed or an election was called.</p><div class="tw"><table><thead><tr><th>Bill</th><th>Sponsor</th><th>First reading</th><th>Where it stopped</th></tr></thead><tbody>'+notLaw.map(function(b){return '<tr><td><a href="'+esc(b.url)+'" target="_blank" rel="noopener"><b>'+esc(b.n)+'</b></a> <span class="muted">'+b.p+'-'+b.s+'</span><br><span style="font-size:.88rem">'+esc(b.t)+'</span></td><td>'+esc(b.sp.join(', '))+'</td><td class="num">'+esc(fmt(b.fr))+'</td><td>'+(b.open?'<span class="chip prog">Still open</span> ':'')+esc(OUT[b.o][0])+'</td></tr>';}).join('')+'</tbody></table></div></section>';
  page('record',h);
}
function recordCard(r){
  var hits=(r.bills||[]).map(function(k){return D.allBills.filter(function(b){return b.k===k;})[0];}).filter(Boolean);
  var links=hits.map(function(b){return bills[b.k]?'<a href="#b-'+b.k+'">'+esc(b.n)+'</a>':'<a href="'+esc(b.url)+'" target="_blank" rel="noopener">'+esc(b.n)+'</a>';});
  var rv=[];hits.forEach(function(b){(billVotes[b.k]||[]).forEach(function(v){if(v.bill===b.n&&rv.indexOf(v)<0)rv.push(v);});});rv.sort(function(a,b){return a.date.localeCompare(b.date);});
  return '<article class="card"><div class="top"><span class="eyebrow">'+esc(fmt(r.date))+(links.length?' · '+links.join(', '):'')+'</span></div><h3>'+esc(r.title)+'</h3><p>'+esc(r.summary)+'</p>'+
   (r.timeline&&r.timeline.length?'<ol class="timeline">'+r.timeline.map(function(t){return '<li><span class="d">'+esc(fmt(t[0]))+'</span>'+esc(t[1])+'</li>';}).join('')+'</ol>':'')+
   (rv.length?'<h4 class="eyebrow" style="margin:0">Recorded votes</h4><ul class="rank">'+rv.map(function(v){var pcb=v.by.PC||{y:0,n:0};return '<li><a href="#v-'+v.id+'">'+esc(v.bill+' · '+v.stage)+'<small>'+esc(fmt(v.date))+' · PC '+pcb.y+' for, '+pcb.n+' against</small></a><span class="num '+(v.carried?'res-c':'res-l')+'">'+v.yes+'–'+v.no+'</span></li>';}).join('')+'</ul>':'')+
   (r.government_position?'<p class="side"><b>Government’s position:</b> '+esc(r.government_position)+'</p>':'')+
   '<p class="srcs">Sources: '+(r.sources||[]).map(function(x){return '<a href="'+esc(x[1])+'" target="_blank" rel="noopener">'+esc(x[0])+'</a>';}).join(', ')+'</p></article>';
}

/* ---------------- routing and events ---------------- */
function render(){
  var h=(location.hash||'').slice(1),ok=true;
  if(h==='votes')vVotes();else if(h==='mpps')vMpps();else if(h==='bills')vBills();else if(h==='downey')vDowney();else if(h==='method')vMethod();else if(h==='opposition')vOpposition();else if(h==='record')vRecord();
  else if(h.indexOf('v-')===0)ok=vVote(h.slice(2));else if(h.indexOf('p-')===0)ok=vMpp(h.slice(2));else if(h.indexOf('b-')===0)ok=vBill(h.slice(2));else vHome();
  if(ok===false)vHome();
}
function keepFocus(id,fn){var el=document.getElementById(id),pos=el&&el.selectionStart;fn();var n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}}
var tmr=null;
app.addEventListener('input',function(e){var t=e.target;
  if(t.id==='vq'){vf.q=t.value;vf.n=40;store.set('vf',vf);clearTimeout(tmr);tmr=setTimeout(function(){keepFocus('vq',vVotes);},120);}
  else if(t.id==='mq'){mf.q=t.value;store.set('mf',mf);clearTimeout(tmr);tmr=setTimeout(function(){keepFocus('mq',vMpps);},120);}
  else if(t.id==='bq'){bf.q=t.value;store.set('bf',bf);clearTimeout(tmr);tmr=setTimeout(function(){keepFocus('bq',vBills);},120);}
  else if(t.id==='oq'){of.q=t.value;store.set('of',of);clearTimeout(tmr);tmr=setTimeout(function(){var y=window.scrollY;keepFocus('oq',vOpposition);window.scrollTo(0,y);},150);}
  else if(t.id==='rq'){store.set('rq',t.value);var v=byId[(location.hash||'').slice(3)];if(v)document.getElementById('rtab').innerHTML=rollRows(v,t.value);}
});
app.addEventListener('change',function(e){var t=e.target,id=t.id;
  var vmap={vparl:'parl',vkind:'kind',vyear:'year',vres:'res',vsort:'sort'};
  if(vmap[id]){vf[vmap[id]]=t.value;vf.n=40;store.set('vf',vf);vVotes();}
  else if(id==='vreb'||id==='vclose'||id==='vlocal'){vf[{vreb:'reb',vclose:'close',vlocal:'local'}[id]]=t.checked;vf.n=40;store.set('vf',vf);vVotes();}
  else if(id==='mparty'||id==='mparl'){mf[id==='mparty'?'party':'parl']=t.value;store.set('mf',mf);vMpps();}
  else if(id==='btype'||id==='bparl'||id==='blaw'){bf[{btype:'type',bparl:'parl',blaw:'law'}[id]]=t.value;store.set('bf',bf);vBills();}
  else if(id==='oparty'||id==='oparl'){var y=window.scrollY;of[id==='oparty'?'party':'parl']=t.value;store.set('of',of);vOpposition();window.scrollTo(0,y);}
  else if(id==='cmp'){var p=bySlug[(location.hash||'').slice(3)];store.set('cmp:'+(p&&p.slug),t.value);document.getElementById('cmpout').innerHTML=compare(p,byName[t.value]);}
});
app.addEventListener('click',function(e){var t=e.target.closest('button,a');if(!t)return;
  if(t.id==='vmore'){vf.n+=60;vVotes();}
  else if(t.id==='vreset'){vf={q:'',parl:'',kind:'',res:'',year:'',reb:false,local:false,close:false,sort:'new',n:40};store.set('vf',vf);vVotes();}
  else if(t.dataset.msort){var k=t.dataset.msort;mf.dir=mf.sort===k?-mf.dir:(k==='votes'||k==='rebel'||k==='part'?-1:1);mf.sort=k;store.set('mf',mf);vMpps();}
  else if(t.dataset.mall){var p=bySlug[t.dataset.mall];document.getElementById('mvl').innerHTML=p.votes.slice().reverse().map(function(x){return voteRow(x.v,'<span class="chip '+(x.vote==='y'?'good':'bad')+'">Voted '+(x.vote==='y'?'for':'against')+'</span>');}).join('');t.parentNode.remove();}
  else if(t.dataset.preset){var pr=t.dataset.preset;vf={q:'',parl:'',kind:pr==='cut'?'cut':pr==='opp'?'opp':'',res:'',year:'',reb:false,local:pr==='local',close:false,sort:'new',n:40};store.set('vf',vf);}
  else if(t.dataset.sort){mf.sort=t.dataset.sort;mf.dir=-1;store.set('mf',mf);}
});
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0);});

fetch('data.json').then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(function(d){D=d;prepare();render();})
 .catch(function(err){app.innerHTML='<p class="loading">The vote data couldn’t load ('+esc(err.message)+'). Reload the page to try again.</p>';});
})();
</script>
